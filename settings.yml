# Curated homepage content toggles (BDEV-236). Each section can be turned off live without a
# code change; the two topic-list sections fail soft to a browse link if their fetch returns
# nothing. Activation of the custom homepage itself is the `custom_homepage` modifier in
# about.json, not a setting here.

homepage_hero_heading:
  type: string
  default: "Welcome to The Askara Assembly"

homepage_hero_subheading:
  type: string
  default: "Practical cybersecurity and compliance: NIS2, ISO 27001, and agentic AI, worked through together."

homepage_hero_cta_label:
  type: string
  default: "Browse categories"

homepage_hero_cta_url:
  type: string
  default: "/categories"

homepage_show_solution_cards:
  type: bool
  default: true

homepage_show_featured:
  type: bool
  default: true

homepage_featured_tag:
  type: string
  default: "featured"

homepage_show_recent_activity:
  type: bool
  default: true

homepage_recent_activity_count:
  type: integer
  default: 5
  min: 1
  max: 12

homepage_show_category_browse:
  type: bool
  default: true

# Per-category solution cards (BDEV-250, option ii-b). Maps a category slug to the list of tag
# cards shown above that category's topic list, so each category reads title -> description ->
# cards -> topics. A theme SETTING, not `allowed_tags`, so it never restricts tagging — it only
# decides which cards appear. Seeded from askara-community structure/taxonomy.yaml's
# `category_card_mapping`; a slug that is absent or maps to [] shows no cards. Card copy
# (title/subtitle) lives in javascripts/discourse/lib/card-copy.js (shared with the homepage
# cards), keyed by tag, with a prettified-tag fallback. JSON string; an unparseable or non-list
# value fails soft to no cards.
category_cards:
  type: string
  default: '{"start-here":["tutorial","how-to","reference","explanation"],"questions":["nis2","iso27001","ai-agents"],"feedback-and-ideas":["bug","feature-request","enhancement"],"general":[]}'

# Community footer (BDEV-320). Ported + trimmed from the askara-web marketing footer, rendered in the
# `main-outlet-bottom` outlet (content column). Homepage-only by default; flip `footer_site_wide` to
# show it on every route — that is the Path A -> site-wide promotion, and it needs no code change.
homepage_show_footer:
  type: bool
  default: true

footer_site_wide:
  type: bool
  default: false

footer_tagline:
  type: string
  default: "Cyber compliance, minus the theater."

# Askara-team identity marks (BDEV-362). Show the Askara logo beside a team member's name
# (alongside the native staff shield) and pill their username + @mentions of them. Client-side,
# driven by the public askara-team roster (BDEV-361). Each surface toggles independently; the
# master switch turns the whole feature off. Group name is configurable so the feature isn't
# hard-wired to one group.
askara_team_marks_enabled:
  type: bool
  default: true

askara_team_group_name:
  type: string
  default: "askara-team"

askara_team_show_flair:
  type: bool
  default: true

askara_team_show_username_pill:
  type: bool
  default: true

askara_team_show_mention_pill:
  type: bool
  default: true

# Auto-apply the staff-color post panel (BDEV-363) to askara-team authors, so their posts carry the
# same brand highlight as core's manual "Add Staff Color" toggle without per-post action. Gated by the
# master switch above; turn this off to keep the marks but leave post backgrounds to the manual toggle.
askara_team_auto_staff_color:
  type: bool
  default: true
